name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is macOS's built-in python3, the oldest that users commonly run.
        python: ["3.9", "3.12"]
        # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build; Ubuntu 24.04 still does.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate plugin
        # Compare with the previous state of the branch, or the PR base, for the version-bump check.
        run: python tools/validate.py --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
