schema_version: "1.1"
name: council-quiet-on-question
description: A question the agent can answer itself does not convene a council.
tags: [trigger, negative, council]
runs: 3
expected_outcome: The agent answers directly without invoking the council skill.
execution:
  prompt: |
    In train.py, what would be a sensible next learning rate to try if training is
    unstable? Just tell me; don't change anything.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-council
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?council"'
    min: 0
    max: 0
    arm: both
