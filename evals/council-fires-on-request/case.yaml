schema_version: "1.1"
name: council-fires-on-request
description: Asking for the agents to deliberate together convenes a council.
tags: [trigger, positive, council]
runs: 3
expected_outcome: The agent invokes the council skill. (Only the trigger is graded, so that eval runs never launch a real council.)
execution:
  prompt: |
    The validation accuracy of train.py has plateaued around 0.86. Get Codex and
    Gemini to brainstorm with you about what we should try next, and come back with
    a direction you all agree on.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?council"'
