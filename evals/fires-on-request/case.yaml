schema_version: "1.1"
name: fires-on-request
description: An explicit request for a second opinion invokes the skill.
tags: [trigger, positive]
runs: 3
expected_outcome: The agent invokes the xreview skill for the uncommitted change.
execution:
  prompt: |
    I changed train.py. Before I merge it, get me a second opinion on my
    uncommitted changes.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?xreview"'
  - name: review-started
    type: tool_used
    tool: Bash
    input_match: 'xreview\.py(\\")?\s+(start|run)\b'
