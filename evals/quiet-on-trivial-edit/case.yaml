schema_version: "1.1"
name: quiet-on-trivial-edit
description: A small obvious edit does not trigger a review.
tags: [trigger, negative]
runs: 3
expected_outcome: The agent fixes the README typo without invoking xreview.
execution:
  prompt: |
    Fix the typo 'recieve' in README.md.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-review
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?xreview"'
    min: 0
    max: 0
    arm: both
